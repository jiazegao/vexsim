name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,viz,ui]"

      # The C++ bridge compiles robot code with g++: MSYS2's MinGW-w64 (UCRT64) on Windows,
      # the runner's own g++ on Linux.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Point vexsim at MinGW g++
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "VEXSIM_CXX=${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\g++.exe"

      - name: Check the C++ toolchain
        run: vexsim doctor

      - name: Lint
        run: ruff check .

      # A test still running after 5 minutes dumps every thread's stack into the log (most
      # take seconds, a LemLib build a few minutes). One that hangs is stopped at the step's
      # timeout, and the next step turns its dump into annotations, which are easier to
      # read than the log.
      - name: Test
        shell: bash
        timeout-minutes: 25
        run: pytest --junitxml=pytest.xml -o faulthandler_timeout=300 2>&1 | tee pytest.log
        env:
          VEXSIM_REQUIRE_CXX: "1"  # fail, don't skip, the C++ bridge tests
          PYTHONUNBUFFERED: "1"

      - name: Report test failures as annotations
        if: failure()
        run: python .github/scripts/pytest_annotations.py pytest.xml pytest.log

      - name: Validate example configs
        shell: bash
        run: |
          for robot in examples/robots/*.yaml; do
            vexsim validate-config "$robot" --field examples/fields/v5rc_empty.yaml --strict -q
          done
          vexsim validate-config examples/robots/full_omni_6m.yaml --field examples/fields/practice_elements.yaml --strict -q
          vexsim validate-config examples/robots/1239e_2026-27.yaml --field examples/fields/1239e_2026-27.yaml --strict -q

      - name: Plots
        shell: bash  # stop at the first failing command (Windows pwsh only checks the last)
        run: |
          vexsim motor-curves --cartridge green --out motor_curves_green.png
          vexsim drift examples/robots/full_omni_6m.yaml --out drift_arc.png
          vexsim odometry examples/robots/full_omni_6m.yaml --out odometry.png
          vexsim run examples/robots/full_omni_6m.yaml --program examples/programs/tour.py --headless --record tour.csv --screenshot tour.png
          vexsim plot tour.csv --out telemetry.png
          vexsim run examples/robots/mecanum_4m.yaml --input examples/inputs/strafe_square.csv --headless --seconds 10 --start=-12,12,0 --screenshot mecanum_square.png
          vexsim run examples/robots/full_omni_6m.yaml --field examples/fields/practice_elements.yaml --input examples/inputs/strafe_square.csv --headless --seconds 9 --start=-48,24,0 --screenshot elements.png
          vexsim bench examples/scenarios/s_curve.yaml --seeds 4 --workers 2 --out bench
          vexsim build examples/pros_projects/minimal_pros4
          vexsim run examples/robots/full_omni_6m.yaml --program examples/pros_projects/minimal_pros4 --headless --start 0,0,90 --record cpp_square.csv --screenshot cpp_square.png
          vexsim run examples/robots/lemlib_example.yaml --program examples/pros_projects/lemlib_template --headless --start 0,0,90 --record lemlib.csv --screenshot lemlib.png
          vexsim bench examples/scenarios/lemlib_vs_python.yaml --seeds 4 --workers 2 --out bench_lemlib
          vexsim run examples/robots/full_omni_6m.yaml --program examples/pros_projects/calibration --headless > calibration_run.txt
          vexsim calibrate examples/robots/full_omni_6m.yaml calibration_run.txt --max-iterations 3 --out calibration
          vexsim run examples/robots/1239e_2026-27.yaml --program examples/pros_projects/1239e_2026-27 --field examples/fields/1239e_2026-27.yaml --routine left40 --headless --record 1239e_left40.csv --screenshot 1239e_left40.png
          python examples/scripts/evaluate_1239e.py --autons "Left 40,Right 30_10" --seeds 1 --workers 2 --plot 1239e_localization.png

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        with:
          name: plots
          path: |
            motor_curves_green.png
            drift_arc.png
            odometry.png
            tour.png
            telemetry.png
            tour.csv
            mecanum_square.png
            elements.png
            calibration/calibration.png
            cpp_square.png
            cpp_square.csv
            lemlib.png
            lemlib.csv
            1239e_left40.png
            1239e_left40.csv
            1239e_localization.png
            bench/
            bench_lemlib/

  # Whole calibration sessions of simulated "real" robots, recorded and fitted (PLAN.md 14.4):
  # minutes each, so in a job of their own, beside the others; plain pytest leaves them out.
  sessions:
    name: Calibration sessions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,viz]"

      - name: Record and fit the sessions
        shell: bash
        timeout-minutes: 40
        run: pytest -m session --junitxml=pytest.xml -o faulthandler_timeout=900 2>&1 | tee pytest.log
        env:
          VEXSIM_REQUIRE_CXX: "1"
          PYTHONUNBUFFERED: "1"

      - name: Report test failures as annotations
        if: failure()
        run: python .github/scripts/pytest_annotations.py pytest.xml pytest.log

  frontend:
    name: Browser app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # vexsim ships the built page (vexsim/ui/static), so it must match the source
      - name: Build
        run: npx vite build

      - name: Check the committed build is current
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- vexsim/ui/static)" ]; then
            git status --short -- vexsim/ui/static
            echo "::error::vexsim/ui/static is out of date: run 'npm run build' in frontend/ and commit the result"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install vexsim
        working-directory: .
        run: python -m pip install -e ".[ui]"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  vscode:
    name: VS Code panel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        shell: bash
        run: |
          python -m pip install -e ".[ui]"
          cd frontend && npm ci

      # `vexsim vscode` packs the extension, VS Code's command line installs it, and a suite
      # runs inside VS Code (on Linux under a virtual display); a failure is an annotation
      - name: The extension in VS Code
        shell: bash
        working-directory: frontend
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run vscode-test; else npm run vscode-test; fi
