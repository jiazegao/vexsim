[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vexsim"
version = "0.1.0"
description = "VEX V5 robot mechanics simulator: drive physics, motor model, sensors, odometry, and PROS/LemLib code in the loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    # the UI's server, for its tests (Starlette's TestClient runs on httpx2)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx2>=2",
]
viz = [
    "matplotlib>=3.8",
    "pygame>=2.5",
]
# `vexsim ui`: the browser app (its page is prebuilt into vexsim/ui/static)
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
vexsim = "vexsim.cli:main"

[tool.setuptools.packages.find]
include = ["vexsim*"]

[tool.setuptools.package-data]
# The PROS 4 shim and robot host runtime, compiled by `vexsim build`
"vexsim.bridge" = [
    "cpp/include/*.h",
    "cpp/include/*/*.h",
    "cpp/include/*/*.hpp",
    "cpp/runtime/*.cpp",
    "cpp/runtime/*.hpp",
    "cpp/runtime/defaults/*.cpp",
    "cpp/route/*.cpp",
    "cpp/motions/include/vexsim/*.hpp",
    "cpp/motions/src/vexsim/*.cpp",
]
# The browser app, built from frontend/ by `npm run build`, and the VS Code extension
"vexsim.ui" = ["static/*", "static/assets/*", "static/icons/*", "vscode/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"vexsim/bench/report.py" = ["E501"]  # the HTML template reads better unwrapped
